<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <defs>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#111827}.sub{font:400 18px Arial,sans-serif;fill:#4b5563}.h{font:700 20px Arial,sans-serif;fill:#111827}.t{font:400 18px Arial,sans-serif;fill:#374151}.ok{font:700 18px Arial,sans-serif;fill:#15803d}.muted{font:400 16px Arial,sans-serif;fill:#6b7280}.card{fill:#f9fafb;stroke:#d1d5db;stroke-width:2}.accent{fill:#fff7ed;stroke:#fb923c;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="540" fill="#ffffff"/>
  <text x="60" y="62" class="title">Real Cluster Validation Snapshot</text>
  <text x="60" y="96" class="sub">Captured 19 Aug 2026 from the Proxmox VE homelab</text>

  <rect x="60" y="130" rx="18" ry="18" width="330" height="150" class="accent"/>
  <text x="90" y="172" class="h">Cluster</text>
  <text x="90" y="208" class="t">Name: labcluster</text>
  <text x="90" y="238" class="ok">Quorum: OK</text>
  <text x="90" y="265" class="t">Votes: 3 / Quorum: 2</text>

  <rect x="435" y="130" rx="18" ry="18" width="330" height="150" class="card"/>
  <text x="465" y="172" class="h">Nodes</text>
  <text x="465" y="208" class="ok">3 / 3 members visible</text>
  <text x="465" y="238" class="t">proxmox · pve2 · pve3</text>
  <text x="465" y="265" class="muted">Corosync transport: knet</text>

  <rect x="810" y="130" rx="18" ry="18" width="330" height="150" class="card"/>
  <text x="840" y="172" class="h">Shared Storage</text>
  <text x="840" y="208" class="ok">TrueNAS NFS: active</text>
  <text x="840" y="238" class="t">Used: 10.37%</text>
  <text x="840" y="265" class="muted">~798.9 GiB available</text>

  <rect x="60" y="320" rx="18" ry="18" width="520" height="150" class="card"/>
  <text x="90" y="362" class="h">High Availability</text>
  <text x="90" y="398" class="ok">CRM master: proxmox (active)</text>
  <text x="90" y="428" class="t">Fencing armed · watchdog active</text>
  <text x="90" y="456" class="muted">HA service vm:200 currently stopped on pve2</text>

  <rect x="620" y="320" rx="18" ry="18" width="520" height="150" class="card"/>
  <text x="650" y="362" class="h">Cluster Resource Scheduling</text>
  <text x="650" y="398" class="ok">Dynamic load CRS reported active</text>
  <text x="650" y="428" class="t">Load imbalance: 2.9%</text>
  <text x="650" y="456" class="muted">Snapshot reflects the runtime state at capture time</text>

  <text x="60" y="512" class="muted">Source commands: pvecm status · pvecm nodes · pvesm status · ha-manager status</text>
</svg>